<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Insta Book</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.460.0"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>body{font-family:'Trebuchet MS',system-ui,sans-serif}.ring{background:conic-gradient(#ff5e62,#ffb347,#6a5bff,#ff5e62);padding:2px;border-radius:9999px}.snap{scroll-snap-type:y mandatory}.snap>*{scroll-snap-align:start}.heart{animation:p .7s forwards}@keyframes p{0%{transform:scale(0)}40%{transform:scale(1.3)}100%{transform:scale(1);opacity:0}}</style></head>
<body class="bg-[#f6f4ff] text-[#1a1740] dark:bg-[#0e0d1c] dark:text-[#eceaff] h-screen overflow-hidden"><div id="app" class="max-w-md mx-auto h-screen relative overflow-hidden"></div>
<script>
const $=id=>document.getElementById(id),A=$('app');
let D=JSON.parse(localStorage.ib||'null')||{users:{anmol_gupta:{u:'anmol_gupta',n:'Anmol Gupta',bio:'Founder of Insta Book',pw:'',v:1,pr:0,av:'',fl:[],sv:[]}},me:null,posts:[{id:1,u:'anmol_gupta',t:'text',m:'',c:'Welcome to Insta Book — created & owned by Anmol Gupta 🚀',f:'',likes:[],cm:[],ts:Date.now()}],stories:[],notes:[],dms:{},dark:0,cid:'IB-'+(1000+Math.random()*9000|0)};
const save=()=>{try{localStorage.ib=JSON.stringify(D)}catch(e){toast('Storage full — delete some posts')}};
let tab='home',ov=null,mode='in',dr={t:'',m:'',f:'',c:''},tm,pr,cl,ls,rs,fm='user',ac,ri,lt=0;
const me=()=>D.users[D.me],esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const e=document.createElement('div');e.className='fixed top-16 left-1/2 -translate-x-1/2 z-[99] bg-indigo-600 text-white px-4 py-2 rounded-full text-sm shadow-lg';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)};
const note=(to,t)=>{if(to!=D.me)D.notes.unshift({to,t,ts:Date.now()})};
const ic=(n,c='')=>`<i data-lucide="${n}" class="${c}"></i>`;
const av=(U,s=10)=>U.av?`<img src="${U.av}" class="w-${s} h-${s} rounded-full object-cover">`:`<div class="w-${s} h-${s} rounded-full bg-indigo-500 text-white grid place-items-center font-bold">${esc((U.n||'?')[0])}</div>`;
const vis=p=>{const U=D.users[p.u];return !U||!U.pr||p.u==D.me||(me().fl||[]).includes(p.u)};
const FL=[['Normal',''],['Mono','grayscale(1)'],['Warm','sepia(.7) saturate(1.3)'],['Vivid','contrast(1.2) saturate(1.8)'],['Cool','hue-rotate(160deg) saturate(1.2)'],['Soft','brightness(1.1) contrast(.9)']];
const rd=(f,cb)=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};
const load=(f,cb)=>{const t=f.type.split('/')[0];if(t=='image'){rd(f,u=>{const i=new Image();i.onload=()=>{const k=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75),'image')};i.src=u})}else if(f.size>2.5e6)toast('Max 2.5 MB for video/audio');else rd(f,u=>cb(u,t))};
const media=p=>p.t=='video'?`<video src="${p.m}" class="w-full max-h-96 object-cover bg-black" style="filter:${p.f}" controls playsinline loop></video>`:p.t=='audio'?`<audio src="${p.m}" controls class="w-full"></audio>`:p.t=='image'?`<img src="${p.m}" class="w-full max-h-96 object-cover" style="filter:${p.f}">`:'';
const post=p=>{const U=D.users[p.u]||{u:p.u,n:p.u},L=p.likes.includes(D.me),S=(me().sv||[]).includes(p.id);return `<article class="bg-white dark:bg-[#171530] mb-3"><button data-a="ov" data-v="u" data-x="${p.u}" class="flex items-center gap-2 p-3 w-full">${av(U,8)}<b>${p.u}</b>${U.v?ic('badge-check','w-4 h-4 text-indigo-500'):''}</button><div class="relative select-none" data-dbl="${p.id}">${media(p)||`<div class="p-8 text-lg font-semibold bg-gradient-to-br from-indigo-600 to-pink-500 text-white">${esc(p.c)}</div>`}</div><div class="flex gap-4 p-3"><button data-a="like" data-id="${p.id}">${ic('heart',L?'fill-red-500 text-red-500':'')}</button><button data-a="ov" data-v="cm" data-x="${p.id}">${ic('message-circle')}</button><button data-a="bm" data-id="${p.id}" class="ml-auto">${ic('bookmark',S?'fill-current':'')}</button></div><div class="px-3 pb-3 text-sm"><b>${p.likes.length} likes</b>${media(p)?`<p><b>${p.u}</b> ${esc(p.c)}</p>`:''}<small class="opacity-60">${p.cm.length} comments</small></div></article>`};
const stb=()=>{D.stories=D.stories.filter(s=>Date.now()-s.ts<864e5);const us=[...new Set(D.stories.map(s=>s.u))];return `<div class="flex gap-3 p-3 overflow-x-auto"><label class="shrink-0 text-center text-xs"><div class="relative">${av(me(),16)}<span class="absolute bottom-0 right-0 bg-indigo-600 text-white rounded-full w-5 h-5 grid place-items-center">+</span></div>Your story<input type="file" accept="image/*,video/*" class="hidden" data-f="story"></label>${us.map(u=>`<button data-a="story" data-u="${u}" class="shrink-0 text-center text-xs"><div class="ring">${av(D.users[u],16)}</div>${u.slice(0,10)}</button>`).join('')}</div>`};
const grid=p=>`<button data-a="ov" data-v="p" data-x="${p.id}" class="aspect-square overflow-hidden bg-gradient-to-br from-indigo-600 to-pink-500 text-white text-xs p-1 text-left">${p.t=='image'?`<img src="${p.m}" class="w-full h-full object-cover" style="filter:${p.f}">`:p.t=='video'?`<video src="${p.m}" class="w-full h-full object-cover" muted></video>`:esc(p.c).slice(0,70)}</button>`;
const sr=q=>{q=q.toLowerCase();const us=q?Object.values(D.users).filter(u=>u.u.includes(q)||u.n.toLowerCase().includes(q)):[];const ps=D.posts.filter(p=>vis(p)&&(!q||p.c.toLowerCase().includes(q)||p.u.includes(q)));return us.map(u=>`<button data-a="ov" data-v="u" data-x="${u.u}" class="flex items-center gap-3 w-full py-2 text-left">${av(u,10)}<span><b>${u.u}</b>${u.v?' ✔':''}<br><small>${esc(u.n)}</small></span></button>`).join('')+`<div class="grid grid-cols-3 gap-1 mt-2">${ps.map(grid).join('')}</div>`};
const inp='w-full px-4 py-2 rounded-xl bg-white dark:bg-[#171530] border border-indigo-300/40 outline-none';
const prof=(U,own)=>{const ps=D.posts.filter(p=>p.u==U.u&&(own||vis(p))),m=D.me&&me(),f=m&&(m.fl||[]).includes(U.u),fo=Object.values(D.users).filter(x=>(x.fl||[]).includes(U.u)).length,lock=U.pr&&!own&&!f;
return `<div class="p-4 text-center"><div class="flex justify-center">${av(U,24)}</div><h2 class="font-bold text-lg mt-2">${esc(U.n)} ${U.v?ic('badge-check','inline w-4 h-4 text-indigo-500'):''}</h2><div class="text-sm opacity-60">@${U.u}${U.pr?' · Private':''}</div><p class="text-sm my-2">${esc(U.bio||'')}</p><div class="flex justify-around text-sm my-3"><div><b>${ps.length}</b><br>Posts</div><div><b>${fo}</b><br>Followers</div><div><b>${(U.fl||[]).length}</b><br>Following</div></div>
${own?`<div class="flex gap-2"><button data-a="ov" data-v="ed" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white">Edit profile</button><button data-a="ov" data-v="ab" class="px-4 rounded-xl bg-black/10 dark:bg-white/10">About</button><button data-a="out" class="px-4 rounded-xl bg-black/10 dark:bg-white/10">${ic('log-out','w-4 h-4')}</button></div><button data-a="priv" class="mt-3 w-full flex justify-between items-center p-3 rounded-xl bg-white dark:bg-[#171530]"><span>Private account</span><span class="w-11 h-6 rounded-full p-0.5 ${U.pr?'bg-indigo-600':'bg-gray-400'}"><span class="block w-5 h-5 bg-white rounded-full ${U.pr?'translate-x-5':''}"></span></span></button>`:`<div class="flex gap-2"><button data-a="fol" data-x="${U.u}" class="flex-1 py-2 rounded-xl ${f?'bg-black/10 dark:bg-white/10':'bg-indigo-600 text-white'}">${f?'Following':'Follow'}</button><button data-a="ov" data-v="dm" data-x="${U.u}" class="flex-1 py-2 rounded-xl bg-black/10 dark:bg-white/10">Message</button></div>`}</div>
${lock?'<p class="text-center p-8 opacity-70">This account is private. Follow to see posts.</p>':`<div class="grid grid-cols-3 gap-1 px-1">${ps.map(grid).join('')||'<p class="col-span-3 text-center p-6 opacity-60">No posts yet.</p>'}</div>${own&&(U.sv||[]).length?`<h3 class="font-bold p-3">Saved</h3><div class="grid grid-cols-3 gap-1 px-1">${D.posts.filter(p=>U.sv.includes(p.id)).map(grid).join('')}</div>`:''}`}`};
const views={home:()=>stb()+D.posts.filter(vis).map(post).join(''),
explore:()=>`<div class="p-3"><input data-in="q" placeholder="Search people & posts" class="${inp}"><div id="sr" class="mt-2">${sr('')}</div></div>`,
create:()=>`<div class="p-4 space-y-3"><label class="block border-2 border-dashed border-indigo-400 rounded-xl p-4 text-center cursor-pointer">${dr.m?media({...dr}):'Tap to choose a photo, video or audio'}<input type="file" accept="image/*,video/*,audio/*" class="hidden" data-f="post"></label><div class="flex gap-2 overflow-x-auto">${FL.map((f,i)=>`<button data-a="flt" data-v="${i}" class="shrink-0 px-3 py-1 rounded-full text-sm ${dr.f==f[1]?'bg-indigo-600 text-white':'bg-black/10 dark:bg-white/10'}">${f[0]}</button>`).join('')}</div><textarea data-in="c" rows="3" placeholder="Write a caption…" class="${inp}">${esc(dr.c)}</textarea><button data-a="pub" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-semibold">Share post</button></div>`,
reels:()=>{const v=D.posts.filter(p=>vis(p)&&(p.t=='video'||p.t=='audio'));return v.length?v.map(p=>`<section class="h-full relative bg-black text-white flex items-center justify-center">${p.t=='video'?`<video src="${p.m}" class="h-full w-full object-contain" style="filter:${p.f}" loop muted playsinline controls></video>`:`<div class="text-center p-6"><div class="text-7xl mb-4">🎵</div><audio src="${p.m}" controls loop></audio></div>`}<div class="absolute left-3 bottom-16 pointer-events-none"><b>@${p.u}</b><p class="text-sm">${esc(p.c)}</p></div><div class="absolute right-3 bottom-20 flex flex-col gap-5 items-center"><button data-a="like" data-id="${p.id}">${ic('heart',p.likes.includes(D.me)?'fill-red-500 text-red-500':'')}<small>${p.likes.length}</small></button><button data-a="ov" data-v="cm" data-x="${p.id}">${ic('message-circle')}</button></div></section>`).join(''):'<p class="p-10 text-center opacity-70">No reels yet. Share a video or audio clip from the + tab.</p>'},
me:()=>prof(me(),1)};
const sheet=(t,b,x='')=>`<div class="absolute inset-0 z-40 bg-[#f6f4ff] dark:bg-[#0e0d1c] flex flex-col"><div class="flex items-center gap-3 p-3 border-b border-indigo-300/30"><button data-a="x">${ic('arrow-left')}</button><b>${t}</b></div><div class="flex-1 overflow-y-auto">${b}</div>${x}</div>`;
const key=u=>[D.me,u].sort().join('|');
const ovs={p:()=>sheet('Post',post(D.posts.find(p=>p.id==ov[1]))),u:()=>sheet('@'+ov[1],prof(D.users[ov[1]],ov[1]==D.me)),
cm:()=>{const p=D.posts.find(p=>p.id==ov[1]);return sheet('Comments',p.cm.map(c=>`<p class="px-4 py-2"><b>${c.u}</b> ${esc(c.t)}</p>`).join('')||'<p class="p-8 text-center opacity-60">Be the first to comment.</p>',`<div class="p-3 flex gap-2"><input id="ci" class="${inp}" placeholder="Add a comment…"><button data-a="sc" class="px-4 rounded-xl bg-indigo-600 text-white">Post</button></div>`)},
dml:()=>sheet('Messages',Object.values(D.users).filter(u=>u.u!=D.me).map(u=>`<button data-a="ov" data-v="dm" data-x="${u.u}" class="flex items-center gap-3 w-full p-3 text-left">${av(u,10)}<b>${u.u}</b></button>`).join('')||'<p class="p-8 text-center opacity-60">No other users yet.</p>'),
dm:()=>sheet('@'+ov[1],`<div class="p-3 space-y-2">${(D.dms[key(ov[1])]||[]).map(m=>`<div class="flex ${m.u==D.me?'justify-end':''}"><span class="px-3 py-2 rounded-2xl max-w-[75%] ${m.u==D.me?'bg-indigo-600 text-white':'bg-white dark:bg-[#171530]'}">${esc(m.t)}</span></div>`).join('')}</div>`,`<div class="p-3 flex gap-2"><input id="mi" class="${inp}" placeholder="Message…"><button data-a="sm" class="px-4 rounded-xl bg-indigo-600 text-white">Send</button></div>`),
nt:()=>sheet('Notifications',D.notes.filter(n=>n.to==D.me).map(n=>`<p class="px-4 py-3 border-b border-indigo-300/20">${esc(n.t)}</p>`).join('')||'<p class="p-8 text-center opacity-60">Nothing new yet.</p>'),
call:()=>sheet('Calls',`<div class="p-5 space-y-4 text-center"><p class="text-sm opacity-70">Your Calling ID — share it with a friend</p><div class="text-4xl font-black tracking-wider">${D.cid}</div><button data-a="cp" class="px-5 py-2 rounded-xl bg-black/10 dark:bg-white/10">${ic('copy','inline w-4 h-4')} Copy ID</button><hr class="border-indigo-300/30"><input id="did" class="${inp} text-center uppercase" placeholder="Friend's ID, e.g. IB-1234"><button data-a="dial" class="w-full py-3 rounded-xl bg-green-600 text-white font-semibold">${ic('phone','inline w-4 h-4')} Video call</button></div>`),
ed:()=>sheet('Edit profile',`<div class="p-5 space-y-3 text-center"><label class="inline-block cursor-pointer">${av(me(),24)}<div class="text-sm text-indigo-500 mt-1">Change photo</div><input type="file" accept="image/*" class="hidden" data-f="av"></label><input id="en" class="${inp}" value="${esc(me().n)}" placeholder="Name"><textarea id="eb" rows="3" class="${inp}" placeholder="Bio">${esc(me().bio||'')}</textarea><button data-a="sed" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-semibold">Save changes</button></div>`),
ab:()=>sheet('About',`<div class="p-10 text-center"><div class="text-4xl font-black bg-gradient-to-r from-pink-500 to-indigo-600 bg-clip-text text-transparent">Insta Book</div><p class="mt-3">Insta Book — Created &amp; Owned by Anmol Gupta</p><p class="text-sm opacity-60 mt-2">Version 1.0</p></div>`),
sv:()=>{const l=D.stories.filter(s=>s.u==ov[1]),s=l[ov[2]];clearTimeout(tm);tm=setTimeout(()=>acts.sn(),5000);return `<div data-a="sn" class="absolute inset-0 z-50 bg-black text-white flex items-center justify-center"><div class="absolute top-3 inset-x-3 flex gap-1">${l.map((_,i)=>`<div class="h-1 flex-1 rounded ${i<=ov[2]?'bg-white':'bg-white/30'}"></div>`).join('')}</div><b class="absolute top-8 left-4">@${s.u}</b>${s.t=='video'?`<video src="${s.m}" autoplay muted playsinline class="max-h-full"></video>`:`<img src="${s.m}" class="max-h-full">`}<button data-a="x" class="absolute top-7 right-4">${ic('x')}</button></div>`}};
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?e.target.play().catch(()=>{}):e.target.pause()),{threshold:.6});
function R(){document.documentElement.classList.toggle('dark',!!D.dark);
if(!D.me){A.innerHTML=`<div class="p-8 pt-24 space-y-3 text-center"><div class="text-5xl font-black bg-gradient-to-r from-pink-500 to-indigo-600 bg-clip-text text-transparent">Insta Book</div><p class="text-sm opacity-60 pb-4">${mode=='in'?'Welcome back':'Create your account'}</p>${mode=='up'?`<input id="an" class="${inp}" placeholder="Full name">`:''}<input id="au" class="${inp}" placeholder="Username" autocapitalize="none"><input id="ap" type="password" class="${inp}" placeholder="Password (4+ characters)"><button data-a="auth" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-semibold">${mode=='in'?'Log in':'Sign up'}</button><button data-a="mode" class="text-sm text-indigo-500">${mode=='in'?'New here? Sign up':'Have an account? Log in'}</button><p class="text-xs opacity-50 pt-8">Created &amp; Owned by Anmol Gupta</p></div>`}
else{const nn=D.notes.some(n=>n.to==D.me&&!n.seen);A.innerHTML=`<header class="absolute top-0 inset-x-0 h-14 z-30 flex items-center px-4 gap-4 bg-white/90 dark:bg-[#171530]/90 backdrop-blur"><b class="text-xl font-black italic bg-gradient-to-r from-pink-500 to-indigo-600 bg-clip-text text-transparent mr-auto">Insta Book</b><button data-a="ov" data-v="call">${ic('phone')}</button><button data-a="dark">${ic(D.dark?'sun':'moon')}</button><button data-a="ov" data-v="nt" class="relative">${ic('bell')}${nn?'<span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-red-500 rounded-full"></span>':''}</button><button data-a="ov" data-v="dml">${ic('send')}</button></header><main class="absolute inset-0 top-14 bottom-16 overflow-y-auto ${tab=='reels'?'snap':''}">${views[tab]()}</main><nav class="absolute bottom-0 inset-x-0 h-16 z-30 flex justify-around items-center bg-white dark:bg-[#171530] border-t border-indigo-300/30" style="padding-bottom:env(safe-area-inset-bottom,0)">${[['home','house'],['explore','search'],['create','square-plus'],['reels','clapperboard'],['me','user']].map(([t,i])=>`<button data-a="tab" data-v="${t}" class="p-3 ${tab==t?'text-indigo-600':'opacity-60'}">${ic(i,'w-6 h-6')}</button>`).join('')}</nav>${ov?ovs[ov[0]]():''}`;
if(ov&&ov[0]=='nt'){D.notes.forEach(n=>n.seen=1);save()}}
lucide.createIcons();document.querySelectorAll('section video').forEach(v=>io.observe(v));
const mi=$('mi');if(mi){mi.focus();mi.parentElement.previousElementSibling.scrollTop=1e9}}
const lk=id=>{const p=D.posts.find(p=>p.id==id),i=p.likes.indexOf(D.me);i<0?(p.likes.push(D.me),note(p.u,`@${D.me} liked your post`)):p.likes.splice(i,1);save();R()};
const ring=on=>{clearInterval(ri);if(!on)return;ac=ac||new AudioContext();ac.resume();const b=()=>[0,.25].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.frequency.value=t?520:440;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.15,s);g.gain.exponentialRampToValueAtTime(.001,s+.22);o.start(s);o.stop(s+.25)});b();ri=setInterval(b,1500)};
const gm=()=>navigator.mediaDevices.getUserMedia({audio:true,video:{facingMode:fm}});
const cb=(a,i,c='bg-white/20')=>`<button data-a="${a}" class="${c} w-14 h-14 rounded-full grid place-items-center">${ic(i)}</button>`;
function cu(m,id){let e=$('call');if(!e){e=document.createElement('div');e.id='call';e.className='fixed inset-0 z-[80] bg-neutral-900 text-white';document.body.appendChild(e)}
e.innerHTML=`<video id="rv" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video><video id="lv" autoplay playsinline muted class="absolute top-4 right-4 w-28 h-40 object-cover rounded-xl border border-white/40 bg-black"></video><div class="absolute top-6 left-4 drop-shadow"><b class="text-xl">${id}</b><div class="text-sm opacity-80">${m=='in'?'Incoming call…':m=='out'?'Calling…':'Connected'}</div></div><div class="absolute bottom-10 inset-x-0 flex justify-center gap-4">${m=='in'?cb('acc','phone','bg-green-500')+cb('end','phone-off','bg-red-500'):cb('mute','mic')+cb('cam','video')+cb('sw','switch-camera')+cb('end','phone-off','bg-red-500')}</div>`;
if(ls)$('lv').srcObject=ls;if(rs)$('rv').srcObject=rs;lucide.createIcons()}
function end(){ring(0);try{cl&&cl.close()}catch(e){}ls&&ls.getTracks().forEach(t=>t.stop());cl=ls=rs=null;$('call')&&$('call').remove()}
function bind(c){cl=c;c.on('stream',s=>{rs=s;ring(0);cu('on',c.peer)});c.on('close',end);c.on('error',end)}
function initPeer(){if(pr||!D.me)return;try{pr=new Peer(D.cid);pr.on('call',c=>{if(cl)return c.close();bind(c);cu('in',c.peer);ring(1)});pr.on('error',e=>{if(e.type=='unavailable-id'){pr=null;D.cid='IB-'+(1000+Math.random()*9000|0);save();initPeer()}else{toast(e.type=='peer-unavailable'?'That ID is not online':'Call error: '+e.type);end()}})}catch(e){toast('Calling unavailable')}}
const acts={tab:d=>{tab=d.v;ov=null;R()},ov:d=>{ov=[d.v,d.x];R()},x:()=>{ov=null;clearTimeout(tm);R()},mode:()=>{mode=mode=='in'?'up':'in';R()},dark:()=>{D.dark=D.dark?0:1;save();R()},
auth:()=>{const u=$('au').value.trim().toLowerCase().replace(/\s/g,''),p=$('ap').value;if(mode=='up'){if(!u||p.length<4)return toast('Enter a username and a 4+ character password');if(D.users[u])return toast('Username already taken');D.users[u]={u,n:$('an').value.trim()||u,bio:'',pw:p,pr:0,v:0,av:'',fl:[],sv:[]};D.me=u;note(u,'Welcome to Insta Book!')}else{const U=D.users[u];if(!U||!U.pw||U.pw!=p)return toast('Wrong username or password');D.me=u}save();tab='home';R();initPeer()},
out:()=>{D.me=null;ov=null;save();R()},like:d=>lk(d.id),
bm:d=>{const s=me().sv=me().sv||[],i=s.indexOf(+d.id);i<0?s.push(+d.id):s.splice(i,1);save();R()},
sc:()=>{const v=$('ci').value.trim(),p=D.posts.find(p=>p.id==ov[1]);if(!v)return;p.cm.push({u:D.me,t:v});note(p.u,`@${D.me} commented: ${v}`);save();R()},
